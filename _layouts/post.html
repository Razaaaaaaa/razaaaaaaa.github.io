---
layout: default
---
<article class="post terminal-window">
  <div class="terminal-titlebar">
    <div class="terminal-buttons">
      <span class="term-btn term-close"></span>
      <span class="term-btn term-min"></span>
      <span class="term-btn term-max"></span>
    </div>
    <div class="terminal-title">
      raza@raza: ~
    </div>
  </div>

  <div class="terminal-body">
    <header class="mb-5">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta d-flex justify-content-between align-items-center">
        <span class="prompt">raza@raza ~$ ./read.sh "{{ page.title }}"</span>
        <time datetime="{{ page.date | date_to_xmlschema }}" style="color: var(--text-muted)">
          {{ page.date | date: "%d %b %Y" }}
        </time>
      </div>
    </header>

    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
